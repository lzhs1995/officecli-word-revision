name: Synthetic tests and packaging
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: wordrev --version
      - run: python -m unittest discover -s skills/officecli-word-revision/scripts -p 'test_*.py' -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
